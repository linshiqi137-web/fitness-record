<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8faf9"><title>健身记录</title><style>:root{font-family:system-ui,-apple-system,'Noto Sans SC',sans-serif;color:#25332e;background:#f8faf9}*{box-sizing:border-box}body{margin:0}main{max-width:780px;margin:auto;padding:22px 16px 90px}h1{font-size:27px;margin:4px 0}h2{font-size:17px;margin:0 0 14px}p,.muted{color:#74817b;font-size:13px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:23px}.pill{border-radius:99px;background:#e7f1eb;padding:7px 11px;color:#40745b;font-size:12px}.card{background:white;border:1px solid #e9efeb;border-radius:19px;padding:19px;margin:13px 0;box-shadow:0 4px 20px #29433307}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#eef5f0;border-radius:14px;padding:14px 9px;text-align:center}.stat strong{display:block;font-size:24px;color:#316b4d}.stat span{font-size:11px;color:#698073}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;color:#65756b;margin:10px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #dce7e0;border-radius:11px;background:#fff;font:inherit;color:#26392e}textarea{resize:vertical;min-height:65px}button{border:0;background:#397a57;color:white;border-radius:11px;padding:12px 17px;font:inherit;cursor:pointer}.secondary{background:#eaf2ec;color:#397a57}.small{padding:7px 10px;font-size:12px}.item{border-top:1px solid #eef1ee;padding:13px 0}.item:first-child{border:0}.itemhead{display:flex;align-items:center;justify-content:space-between;gap:12px}.item strong{font-size:14px}.item small{color:#7b8980}.empty{padding:20px;text-align:center;color:#9aa69e}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bar{height:8px;background:#e9f0eb;border-radius:9px;overflow:hidden;margin-top:6px}.fill{height:100%;background:#78b192}.note{line-height:1.7}.foot{text-align:center;color:#a1aaa4;font-size:12px;margin-top:24px}@media(max-width:450px){.stats{gap:6px}.stat strong{font-size:21px}.card{padding:15px}}</style></head><body><main><div class="head"><div><div class="muted">MY FITNESS JOURNAL</div><h1>健身记录</h1><div class="muted">慢慢练，慢慢变强。</div></div><span class="pill">自己的节奏 ♡</span></div><div class="stats"><div class="stat"><strong id="days">0</strong><span>训练天数</span></div><div class="stat"><strong id="pull">—</strong><span>引体向上最佳</span></div><div class="stat"><strong id="weight">—</strong><span>最新体重 kg</span></div></div><section class="card"><div class="itemhead"><h2>小栞安排的下次训练</h2><span class="pill">轻松开始</span></div><div id="plan" class="note"></div><div class="row" style="margin-top:12px"><button class="secondary small" onclick="copyReport()">复制训练汇报给小栞</button><button class="secondary small" onclick="exportData()">导出数据给小栞</button></div><p>每次训练前，把导出的记录发给小栞；我会根据恢复情况和上次表现安排新计划，并生成可导入的更新文件。</p></section><section class="card"><h2>记一次训练</h2><div class="grid"><div><label>日期</label><input id="date" type="date"></div><div><label>动作</label><select id="exercise"><option>哑铃弯举</option><option>锤式弯举</option><option>正手引体向上</option><option>辅助引体向上</option><option>哑铃卧推</option><option>坐姿划船</option><option>深蹲</option><option>跑步机慢走</option><option>其他</option></select></div><div><label>重量（kg，每只哑铃）</label><input id="kg" type="number" min="0" step="0.5" placeholder="自重可留空"></div><div><label>组数</label><input id="sets" type="number" min="1" value="2"></div><div><label>每组次数</label><input id="reps" type="number" min="1" value="10"></div><div><label>感受</label><select id="feel"><option>轻松</option><option selected>适中</option><option>吃力</option><option>接近力竭</option></select></div></div><label>备注（选填）</label><textarea id="note" placeholder="今天有什么小发现？"></textarea><div class="row" style="margin-top:12px"><button onclick="addTraining()">保存训练</button><span class="muted">跑步机等有氧可在备注中记录时间和速度</span></div></section><section class="card"><h2>体重记录</h2><div class="grid"><div><label>日期</label><input id="wdate" type="date"></div><div><label>体重（kg）</label><input id="wkg" type="number" min="20" max="300" step="0.1" placeholder="例如 52.5"></div></div><button class="secondary" style="margin-top:12px" onclick="addWeight()">记录体重</button><div id="weightList"></div></section><section class="card"><div class="itemhead"><h2>训练历史</h2><button class="small secondary" onclick="exportData()">导出备份</button></div><div id="history"></div></section><section class="card"><h2>进步轨迹</h2><div id="progress" class="note muted"></div></section><section class="card"><h2>数据管理 · 与小栞同步</h2><p class="note">数据只保存在当前浏览器里。导出JSON发给小栞，我可以编辑记录和下次计划，再把更新文件交给你导入。换浏览器或清除数据前请备份。</p><div class="row"><label class="secondary small" style="cursor:pointer;border-radius:10px;margin:0">导入备份 <input type="file" accept="application/json" onchange="importData(event)" style="display:none"></label><button class="secondary small" onclick="if(confirm('确定清空所有记录吗？')){localStorage.removeItem(KEY);render()}">清空记录</button></div></section><div class="foot">健身记录 · 记录进步，不记录压力</div></main><script>const KEY='mio-fitness-v1';let data=load();function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.trainings)&&Array.isArray(d.weights))return d}catch(e){}return {trainings:[{id:1,date:'2026-10-11',exercise:'哑铃弯举',kg:5,sets:2,reps:10,feel:'适中',note:'第一次健身；组数依据当天聊天整理，部分记录可能有重复'},{id:2,date:'2026-10-11',exercise:'锤式弯举',kg:5,sets:2,reps:10,feel:'适中',note:'第一次健身'},{id:3,date:'2026-10-11',exercise:'哑铃弯举',kg:7.5,sets:1,reps:10,feel:'接近力竭',note:'最后一次举不上去'},{id:4,date:'2026-10-11',exercise:'锤式弯举',kg:7.5,sets:1,reps:10,feel:'吃力',note:'第一次健身'}],weights:[],plan:{date:'待确定',title:'第二次训练 · 轻量全身',items:[{name:'热身慢走',target:'5分钟'},{name:'正手引体向上或辅助引体',target:'2组，保留2次余力'},{name:'器械推胸',target:'2组×8～10次，轻重量'},{name:'坐姿腿举',target:'2组×10次，轻重量'},{name:'哑铃弯举',target:'1～2组×10次，每只5kg或更轻'}],note:'至少休息48小时；若手臂仍明显酸痛、睡眠不足或吃得太少，先休息。近期安排内科检查食欲下降。'}}}function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function val(id){return document.getElementById(id).value}function addTraining(){const sets=Number(val('sets')),reps=Number(val('reps')),kg=val('kg')===''?null:Number(val('kg'));if(!val('date')||sets<1||reps<1||kg!==null&&kg<0)return alert('请检查日期、重量和次数');data.trainings.push({id:Date.now(),date:val('date'),exercise:val('exercise'),kg,sets,reps,feel:val('feel'),note:val('note')});document.getElementById('note').value='';save()}function addWeight(){const kg=Number(val('wkg'));if(!val('wdate')||kg<20||kg>300)return alert('请输入有效日期和体重');data.weights.push({id:Date.now(),date:val('wdate'),kg});document.getElementById('wkg').value='';save()}function del(type,id){if(confirm('删除这条记录？')){data[type]=data[type].filter(x=>x.id!==id);save()}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const plan=data.plan||{};document.getElementById('plan').innerHTML='<strong>'+esc(plan.title||'等待小栞安排')+'</strong><p>'+esc(plan.date||'')+'</p>'+(Array.isArray(plan.items)?'<ol>'+plan.items.map(x=>'<li>'+esc(x.name)+'：'+esc(x.target)+'</li>').join('')+'</ol>':'')+'<p>'+esc(plan.note||'')+'</p>';const ts=[...data.trainings].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id),ws=[...data.weights].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);document.getElementById('days').textContent=new Set(ts.map(x=>x.date)).size;const pulls=ts.filter(x=>x.exercise==='正手引体向上');document.getElementById('pull').textContent=pulls.length?Math.max(...pulls.map(x=>x.reps)):'6*';document.getElementById('weight').textContent=ws.length?ws[0].kg:'—';document.getElementById('history').innerHTML=ts.length?ts.map(x=>`<div class="item"><div class="itemhead"><strong>${esc(x.exercise)} · ${esc(x.kg===null?'自重':x.kg+'kg')} </strong><button class="secondary small" onclick="del('trainings',${Number(x.id)})">删除</button></div><small>${esc(x.date)} · ${esc(x.sets)}组 × ${esc(x.reps)}次 · ${esc(x.feel)}</small>${x.note?`<p class="note">${esc(x.note)}</p>`:''}</div>`).join(''):'<div class="empty">还没有记录，今天就开始吧</div>';document.getElementById('weightList').innerHTML=ws.slice(0,12).map(x=>`<div class="item itemhead"><span>${esc(x.date)} · <strong>${esc(x.kg)}kg</strong></span><button class="secondary small" onclick="del('weights',${Number(x.id)})">删除</button></div>`).join('');const names=['哑铃弯举','锤式弯举','正手引体向上'];document.getElementById('progress').innerHTML=names.map(n=>{const a=ts.filter(x=>x.exercise===n);if(!a.length)return '';const best=Math.max(...a.map(x=>n==='正手引体向上'?x.reps:(x.kg||0)));return `<div style="margin:12px 0"><div class="itemhead"><strong>${n}</strong><span>${best}${n==='正手引体向上'?'次':'kg'}</span></div><div class="bar"><div class="fill" style="width:${Math.min(100,best/(n==='正手引体向上'?20:15)*100)}%"></div></div></div>`}).join('')+'<p>* 6个引体向上为此前体测成绩，未计入训练日志。</p>'}async function copyReport(){const ts=[...data.trainings].sort((a,b)=>b.date.localeCompare(a.date));const lines=['小栞，这是我的健身记录，请帮我安排下次训练：',...ts.slice(0,24).map(x=>`${x.date} ${x.exercise} ${x.kg??'自重'}kg ${x.sets}组×${x.reps}次，${x.feel}。${x.note||''}`),'最近体重：'+(data.weights.length?[...data.weights].sort((a,b)=>b.date.localeCompare(a.date))[0].kg+'kg':'未记录')];const t=lines.join('\n');try{await navigator.clipboard.writeText(t);alert('已复制，回到聊天粘贴给小栞即可')}catch(e){prompt('请复制以下内容',t)}}function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='健身记录-发给小栞.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}async function importData(e){const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.trainings)||!Array.isArray(d.weights))throw Error();if(confirm('导入会覆盖当前数据，继续吗？')){data=d;save()}}catch(err){alert('备份文件格式不正确')}e.target.value=''}const today=new Date(),local=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10);document.getElementById('date').value=local;document.getElementById('wdate').value=local;save();</script></body></html>
